# Retrain protocol F13-v1, reconstructed from the F13 retrains as they were executed
# (training_params.txt of data/qnas/experiment_v3_cifar10 exp0-15 and data/medmnist/qnas/*_2025,
# plus the code in git up to 2025-09-10). See docs/ESTRATEGIA_REENTRENAMIENTO_COMPARACION_LITERATURA.md §3.
#
# Applies identically to MoQ-NAS, NSGA-II and NSGA-III (Q-NAS is NOT retrained).
# Every value must be passed explicitly to the retrain; nothing is inherited from the
# search log_params_evolution.txt (search logs differ: fp16 vs bf16, eval_window_agg, dataset config paths).
#
# Keys marked NEEDS_OVERRIDE are not accepted by retrain_parallel.py yet (see fixes 4.2, 4.3, 4.10, P1 table).
#
# CIFAR-10 augmentation (decision 2026-10-04, pilot 2, doc §4e): every CIFAR-10 retrain (C1_triobj and
# AF_std_biobj) uses option (c) = crop + flip + TrivialAugment + Cutout(16), set in `datasets.cifar10`.
# Tag convention: CIFAR-10 -> F13v1c; MedMNIST -> F13v1 (augmentation `ta`, unchanged); fairness -> fairR1/fairR2.
# The F13v1 tag on CIFAR-10 belongs to pilot 1 only (6 nets of moqnas exp22, `ta`); the launcher refuses
# to mix augmentation policies under one tag.

protocol: F13-v1

common:
  max_epochs: 300
  epochs_to_eval: 300              # retrain evaluates every epoch
  patience_retrain: 300            # = max_epochs -> no early stopping
  delta_fraction: 0.005            # irrelevant with patience = max_epochs
  lr_scheduler: multistep          # MultiStepLR, milestones at 50 % / 75 % of max_epochs, gamma 0.1
  optimizer: AdamW
  learning_rate: 0.001             # NEEDS_OVERRIDE
  weight_decay: 0.01               # NEEDS_OVERRIDE  (F13-v1 used PyTorch AdamW defaults; the logged 1e-4 was ignored)
  # precision: NOT common -> per case, equal to the precision of that case's search (see `cases` below).
  grad_clip_norm: null             # NEEDS_OVERRIDE  (no gradient clipping in F13-v1; current trainer always clips at 1.0)
  eval_window_agg: max             # NEEDS_OVERRIDE  (reported val accuracy = best epoch)
  data_augmentation: true          # TrivialAugmentWide(31) + ToTensor + Normalize (no crop/flip)
  augmentation_policy: ta          # F13 as executed (TrivialAugment only); CIFAR-10 overrides it below
  train_split: 0.9                 # NEEDS_OVERRIDE  (explicit; CIFAR-10 -> 45k/5k, test = official 10k)
  split_seed: 2025                 # deliberate deviation: F13-v1 split was unseeded; same ratio/stratification
  limit_data: false
  num_workers: 8
  seeds: [1, 2, 3]                 # NEEDS_OVERRIDE  (fix 4.3); screening uses seed 1 only
  checkpoint_rule: best_val_accuracy   # test evaluated once, with this checkpoint
  keep_scheduler_first_epoch_skip: true  # F13-v1 trainer skipped the scheduler step on the first val epoch; do not fix 4.8 under this protocol

# Precision = the one used by the search of each case (identical for all algorithms within a case).
# NEEDS_OVERRIDE: pass --precision explicitly; never inherit it from the search log.
cases:
  C1_triobj:        {precision: fp16}   # moqnas_v2 exp22, nsga2 exp4, nsga3 exp1: mixed_precision: true
  AF_std_biobj:     {precision: bf16}   # experiment_cifar10_acc_flops (all algorithms): precision: bf16
  C2_medmnist:      {precision: fp16}   # 4 datasets x 3 algorithms: mixed_precision: true
  C3_fairness:      {precision: fp16}   # personbin MoQ-NAS search: mixed_precision: true
  C3_baselines:     {precision: fp16}   # fixed architectures were trained in fp32 (train.py); retrain them in fp16, as the MoQ-NAS fairness search

datasets:
  cifar10:
    dataset: cifar10
    data_path: datasets/cifar10_data
    config_path_dataset: dataset_configs/cifar10.yaml     # fix 4.10: older logs point to configs/
    augmentation_policy: standard_cutout   # option (c), adopted after pilot 2 (doc §4e); tag F13v1c
    batch_size: 256
    eval_batch_size: 256
  pathmnist:
    dataset: pathmnist
    data_path: datasets/pathmnist_data
    config_path_dataset: dataset_configs/pathmnist.yaml
    batch_size: 128
    eval_batch_size: 128
  octmnist:
    dataset: octmnist
    data_path: datasets/octmnist_data
    config_path_dataset: dataset_configs/octmnist.yaml
    batch_size: 128
    eval_batch_size: 128
  tissuemnist:
    dataset: tissuemnist
    data_path: datasets/tissuemnist_data
    config_path_dataset: dataset_configs/tissuemnist.yaml
    batch_size: 128
    eval_batch_size: 128
  organamnist:
    dataset: organamnist
    data_path: datasets/organamnist_data
    config_path_dataset: dataset_configs/organamnist.yaml
    batch_size: 128
    eval_batch_size: 128
  person_bin_96:
    dataset: person_bin_96
    data_path: datasets/personbin_data_96
    config_path_dataset: dataset_configs/person_bin_96.yaml
    batch_size: 64
    eval_batch_size: 64

# Case 3 (fairness) uses its own profiles, selected with --profile. Values override `common`.
# Same profile for MoQ-NAS and for the fixed baselines (scripts/fairness_baseline/train.py).
# FACET evaluation (FairnessMetric) runs at the training resolution (96) with the case precision;
# --keep_metrics is required so the metric is built in the retrain (fixes 4.9 / master.py injection).
profiles:
  medmnist_v2_adamw:    # P-Med, MAIN protocol of Case 2 (decision 2026-10-05; screening and confirmation, tag PMedW):
                        # schedule of the MedMNIST v2 ResNet baselines (Yang et al., Sci. Data 2023): 100 epochs,
                        # x0.1 at epochs 50 and 75, batch 128 (dataset entry), no augmentation, best-val checkpoint,
                        # with the optimizer of every other case and of the authors' previous MedMNIST work: AdamW
                        # lr 1e-3, weight decay 0.01 (F13-v1). Differences from MedMNIST v2: AdamW instead of Adam,
                        # and fp16 (the case precision; MedMNIST v2 does not state it).
    max_epochs: 100
    epochs_to_eval: 100
    patience_retrain: 100
    optimizer: AdamW
    learning_rate: 0.001
    weight_decay: 0.01
    lr_scheduler: multistep
    num_workers: 4         # 2026-10-06: 8 -> 4 per loader (RAM on LIRA); does not change results without random augmentation
    data_augmentation: false
  medmnist_v2_adamw_ta: # Optional variant of P-Med, only if time allows (tag PMedW_TA): identical, plus TrivialAugmentWide
                        # (the augmentation of the F13 MedMNIST retrains). No flips or cutout: a horizontal flip changes
                        # the label of left/right organs in OrganAMNIST, a vertical flip breaks the layer orientation
                        # of OCT, and a 16 px cutout covers a third of a 28x28 image.
    max_epochs: 100
    epochs_to_eval: 100
    patience_retrain: 100
    optimizer: AdamW
    learning_rate: 0.001
    weight_decay: 0.01
    lr_scheduler: multistep
    num_workers: 4         # 2026-10-06: 8 -> 4 per loader (RAM on LIRA); does not change results without random augmentation
    data_augmentation: true
    augmentation_policy: ta
  medmnist_v2:          # Exact MedMNIST v2 ResNet protocol (Adam lr 1e-3, no weight decay). Reference only: NOT used,
                        # the user chose AdamW (2026-10-05; profile medmnist_v2_adamw).
    max_epochs: 100
    epochs_to_eval: 100
    patience_retrain: 100
    optimizer: Adam
    learning_rate: 0.001
    weight_decay: 0.0
    lr_scheduler: multistep
    data_augmentation: false
  cifar_aug_c:          # Option (c) as run in pilot 2 (tag F13v1c): RandomCrop(32, pad 4) + HorizontalFlip +
                        # TrivialAugmentWide + Cutout(16). Now the CIFAR-10 default (`datasets.cifar10`), so this
                        # profile is redundant; kept so the pilot-2 command stays reproducible.
    augmentation_policy: standard_cutout
  fairness_R1:          # search budget, as the MoQ-NAS fairness search (Dec 2025 - Feb 2026 code)
    max_epochs: 50
    epochs_to_eval: 50
    patience_retrain: 50
    lr_scheduler: None
    learning_rate: 0.001
    weight_decay: 0.0001   # the search code already read weight_decay from the config (after 2025-09-20)
    limit_data: true
    limit_data_value: 10000
    keep_metrics: true
  fairness_R2:          # full data; F13-v1 optimisation; epochs fixed after the pilot
    max_epochs: null      # REQUIRED: pass --max-epochs after the pilot
    epochs_to_eval: null  # set equal to max_epochs
    patience_retrain: null
    limit_data: false
    keep_metrics: true
