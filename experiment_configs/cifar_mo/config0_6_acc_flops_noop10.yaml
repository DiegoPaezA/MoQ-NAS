# Standard search space (11 operators) — CONTROL CELL for a fair comparison
# against config7_1_mixed.yaml (mixed search space, 18 operators).
#
# Objectives: (best_accuracy, total_flops), 2 objectives.
#
# Purpose
# -------
# config0_3_acc_flops.yaml vs config7_1_mixed.yaml differ in FOUR factors at
# once (operator vocabulary, cost prior, no_op caps, crossover strategy), so a
# difference between them cannot be attributed to the search space.
# This config matches config7_1_mixed.yaml on EVERY factor except the operator
# vocabulary, which is the factor under study.
#
#   cell                          space        crossover      no_op prior/cap
#   ---------------------------------------------------------------------------
#   config0_3_acc_flops.yaml      standard 11  directional    0.333 / 0.9
#   config0_4_acc_flops.yaml      standard 11  random_elite   0.333 / 0.9
#   config0_6 (this file)         standard 11  random_elite   0.10  / 0.10
#   config7_1_mixed.yaml          mixed 18     random_elite   0.10  / 0.10
#
#   config0_6 vs config7_1_mixed  ->  isolates the operator vocabulary.
#
# Deltas vs config0_4_acc_flops.yaml (all four required for the comparison to
# be fair; the first is the essential one):
#   1. function_dict probability budget rebalanced to mirror the mixed budget
#      (compute 80% / pooling 10% / no_op 10%). Lowering noop_max_prob alone
#      would be self-contradictory: the cap would be violated at generation 0,
#      because the initial no_op probability comes from 'prob' (was 1/3 = 33%).
#   2. noop_max_prob  0.9  -> 0.10
#   3. noop_ramp_cap  true -> false
#   4. train_timeout  3600 -> 7200  (same per-candidate budget as mixed)
#
# Probability budget (initial, from_config):
#   Conv (ConvBlock)   80%  ->  8 ops x 10.0% each
#   Pooling (Max/Avg)  10%  ->  2 ops x  5.0% each
#   no_op              10%  ->  1 op  x 10.0%
#   ─────────────────────────────────────────────
#   Total             100%      11 operators
#
# Vocabulary overlap with config7_1_mixed.yaml: 7 shared operators
# (avg_pool_2_2, conv_3_1_32, conv_3_1_64, conv_3_1_128, conv_5_1_64,
# max_pool_2_2, no_op); 4 only here (conv_1_1_32, conv_1_1_64, conv_3_1_256,
# conv_5_1_32); 11 only in mixed. The two spaces are NOT nested.

QNAS:
    crossover_rate: 0.5
    max_generations: 150
    max_num_nodes: 20
    num_quantum_ind: 5
    penalize_number: 3
    repetition: 4
    replace_method: best
    update_quantum_gen: 1
    crossover_frequency: 1
    pop_crossover_rate: 0.4 # offspring replacement proportion in the population
    pop_crossover_method: ['hux', 'one_point', 'two_point'] # 'hux' | 'one_point' | 'two_point'
    mo_crossover_strategy: random_elite # matches config7_1_mixed.yaml
    patience: 60
    elite_mode: global_k # "single" | "global_k" | "bootstrap_k" | "old"
    k_elites: 5
    pool_factor: 3
    ema_beta: 0.7
    rank_weighting: True
    initial_prob_distribution: from_config # from_config | uniform

    # --- Network Architecture Rules ---
    terminal_op_name: "no_op"
    pool_op_name: "pool"
    min_active_len: 1
    truncate_after_noop: false
    avoid_consecutive_pool: false
    enforce_noop_in_update: true
    noop_max_prob: 0.10      # hard cap: no_op never exceeds its initial 10%
    noop_ramp_cap: false     # cap is flat (not ramped) since budget is already low

    quantum_update_config:
      quantum_rate_schedule: 'cosine'                     # use 'cosine' schedule or 'static'
      max_update_schedule: 'cosine'                       # use 'cosine' schedule or 'static'
      static_quantum_rate: 0.1                            # (Your old 0.4 / 5)
      static_max_update: 0.05                             # (Your old 0.105 / 5)
      quantum_rate_schedule_params:                       # Parameters for 'cosine cyclic' rate schedule
          start: 0.25                                      # Scaled down from 0.4
          end: 0.1                                       # Scaled down from ~0.01
      max_update_schedule_params:                         # Parameters for 'cosine annealing' max_update schedule
          start: 1.0                                      # if F <= 12: start * 0.07 ; if F <= 32: start * 0.05
          end: 0.8
      intensity_min: 0.5                                  # Intensity sampling range - not used
      intensity_max: 1.0                                  # Intensity sampling range - not used

    params_ranges:
      decay: 0.9
      learning_rate: 0.001
      momentum: 0.0
      weight_decay: 1.0e-4
      backbone_percentage: [0.1, 0.999]

    # Probability budget: Conv 80% (8 x 0.8/8.0), Pooling 10% (2 x 0.1/2.0), no_op 10%.
    function_dict:  {'conv_1_1_32':  {'function': 'ConvBlock', 'params': {'kernel': 1, 'strides': 1, 'filters': 32}, 'prob': 0.8/8.0},
                     'conv_1_1_64':  {'function': 'ConvBlock', 'params': {'kernel': 1, 'strides': 1, 'filters': 64}, 'prob': 0.8/8.0},
                     'conv_3_1_32':  {'function': 'ConvBlock', 'params': {'kernel': 3, 'strides': 1, 'filters': 32}, 'prob': 0.8/8.0},
                     'conv_3_1_64':  {'function': 'ConvBlock', 'params': {'kernel': 3, 'strides': 1, 'filters': 64}, 'prob': 0.8/8.0},
                     'conv_3_1_128': {'function': 'ConvBlock', 'params': {'kernel': 3, 'strides': 1, 'filters': 128}, 'prob': 0.8/8.0},
                     'conv_3_1_256': {'function': 'ConvBlock', 'params': {'kernel': 3, 'strides': 1, 'filters': 256}, 'prob': 0.8/8.0},
                     'conv_5_1_32':  {'function': 'ConvBlock', 'params': {'kernel': 5, 'strides': 1, 'filters': 32}, 'prob': 0.8/8.0},
                     'conv_5_1_64':  {'function': 'ConvBlock', 'params': {'kernel': 5, 'strides': 1, 'filters': 64}, 'prob': 0.8/8.0},
                     'max_pool_2_2': {'function': 'MaxPooling', 'params': {'kernel': 2, 'strides': 2}, 'prob': 0.1/2.0},
                     'avg_pool_2_2': {'function': 'AvgPooling', 'params': {'kernel': 2, 'strides': 2}, 'prob': 0.1/2.0},
                     'no_op':        {'function': 'NoOp', 'params': {}, 'prob': 0.1}}

train:
    batch_size: 256
    eval_batch_size: 256
    max_epochs: 50
    epochs_to_eval: 5
    eval_window_agg: mean   # how best_accuracy is aggregated over the eval window: max | mean | last
    optimizer: AdamW
    precision: bf16 # fp32|fp16|bf16
    device: cuda:0

    # Dataset
    dataset: Cifar10
    config_path_dataset: dataset_configs/cifar10.yaml   # <— updated key (points to your YAML)
    data_path: /path/to/datasets/cifar10        # set this to your local path
    train_split: 0.9
    split_seed: 2025                             # controls split & balanced limiting
    loader_seed: 777                             # controls DataLoader shuffling
    download: true                               # safe even if files already exist
    stats_max_batches: 10                        # used only if YAML sets stats_mode: sample
    data_augmentation: false
    subtract_mean: true
    limit_data: true
    limit_data_value: 10000
    num_workers: 4

    # Hardware settings - parallelization
    threads: 20
    train_timeout: 7200 # 2 hours — matches config7_1_mixed.yaml

    # Network structure Configuration
    network_config: default
    backbone_name: mobilenet_v3_small

    # Multi-objective parameters
    multi_objective: True
    num_objectives: 2
    objectives: ['best_accuracy', 'total_flops']
    metrics:
      - name: Accuracy
      - name: HardwareMetrics
      - name: ValidationLossFitness
    artifacts:
      - name: ConfusionMatrix
