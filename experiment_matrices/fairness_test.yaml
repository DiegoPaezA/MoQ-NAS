# Smoke test: multi-objective fairness search (best_accuracy, fairness_spd,
# fairness_mean_tpr) for all four MO algorithms, 1 repeat × 3 generations.
#
# Training on CIFAR-10 (limit_data: 10000); fairness evaluated serially on
# FACET (datasets/facet_data/facet_eval.csv) after each parallel generation.
# Fairness eval is serial/spawn — workers_per_gpu controls only training
# concurrency. Use 5 workers to leave headroom for the fairness inference pass.
#
# Precision: bf16 (set in config0_3.yaml).
#
# Run with:   python launch.py experiment_matrices/fairness_test.yaml
# Preview:    python launch.py experiment_matrices/fairness_test.yaml --dry-run
# Resume:     python launch.py experiment_matrices/fairness_test.yaml --resume
exp_root: experiment_cifar10_fairness_test
gpus: [1]            # physical GPU 1 (CUDA_VISIBLE_DEVICES=1)
gpus_per_run: 1      # one GPU per experiment, one experiment at a time
repeats: 1
seed_base: 42        # single repeat uses seed 43

defaults:
  data_path: datasets/cifar10_data
  dataset: cifar10
  config_path_dataset: dataset_configs/cifar10.yaml
  log_level: INFO
  multi_objective: true
  population_size: 20         # used by nsga2/nsga3/moead (ignored by moqnas)
  num_generations: 3          # short smoke test
  workers_per_gpu: 5          # 5 concurrent training workers; fairness eval is serial after

experiments:
  - {algo: moqnas, config: experiment_configs/cifar_mo/config0_3.yaml, name: moqnas}
  - {algo: nsga2,  config: experiment_configs/cifar_mo/config0_3.yaml, name: nsga2}
  - {algo: nsga3,  config: experiment_configs/cifar_mo/config0_3.yaml, name: nsga3,
    overrides: {ref_divisions: 6}}
  - {algo: moead,  config: experiment_configs/cifar_mo/config0_3.yaml, name: moead,
    overrides: {ref_divisions: 6, moead_T: 10, moead_scalar: tchebycheff, moead_pneighbor: 0.9}}
